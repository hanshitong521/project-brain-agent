[project]
name = "project-brain-agent"
version = "0.1.0"
description = "Project Brain MCP — v1 minimal loop"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.6.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pyyaml>=6.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
mem0 = [
  "mem0ai>=2.0.0",
  "qdrant-client>=1.12.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.scripts]
brain-mcp = "brain_mcp.server:main"
brain-api = "brain_api.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_mcp", "src/brain_api", "src/brain_services"]
