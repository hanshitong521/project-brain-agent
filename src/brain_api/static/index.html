<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Brain · 控制台入口</title>
  <style>
    :root {
      --bg0: #070b12; --bg1: #0c1220; --surface: rgba(22, 30, 48, 0.92);
      --border: rgba(148, 163, 184, 0.16); --text: #f1f5f9; --muted: #94a3b8;
      --accent: #60a5fa; --accent-dim: rgba(96, 165, 250, 0.14); --radius: 12px;
      --mono: ui-monospace, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(180deg, var(--bg0), var(--bg1));
      color: var(--text);
      font: 15px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 32px 24px 48px;
    }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
    .grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      max-width: 960px;
    }
    a.card {
      display: block; padding: 20px 18px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); text-decoration: none;
      transition: border-color 0.15s, background 0.15s;
    }
    a.card:hover { border-color: rgba(96, 165, 250, 0.45); background: var(--accent-dim); }
    a.card h2 { margin: 0 0 8px; font-size: 1.05rem; color: var(--accent); }
    a.card p { margin: 0; font-size: 13px; color: var(--muted); }
    footer {
      margin-top: 32px; max-width: 960px; font-size: 12px; color: var(--muted);
      font-family: var(--mono); word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>Project Brain 控制台</h1>
  <p class="sub">请通过 Brain API 访问本页（勿用 file:// 打开 HTML），否则别名与统计接口会返回 404。</p>
  <div class="grid" id="links"></div>
  <footer id="meta"></footer>
  <script>
    async function loadNav() {
      const r = await fetch("/api/nav");
      const nav = r.ok ? await r.json() : {};
      const items = [
        { href: nav.dashboard || "/dashboard", title: "记忆看板", desc: "项目别名、记忆池、规则与 Token 统计" },
        { href: nav.lessons || "/lessons", title: "教训库", desc: "已生效/待审教训、Markdown、可编辑晋升" },
        { href: nav.mcp_lab || "/mcp-lab", title: "MCP 实验室", desc: "MCP 活动日记、标注与压缩教训" },
      ];
      if (nav.contextmind_dashboard) {
        items.push({
          href: nav.contextmind_dashboard,
          title: "ContextMind Token 看板",
          desc: "telemetry 三列账（默认 8899）",
        });
      }
      if (nav.contextmind_prompt_lab) {
        items.push({
          href: nav.contextmind_prompt_lab,
          title: "ContextMind Prompt Lab",
          desc: "提示词实验台（默认 8898）",
        });
      }
      const grid = document.getElementById("links");
      grid.innerHTML = items.map((it) =>
        `<a class="card" href="${it.href}"><h2>${it.title}</h2><p>${it.desc}</p></a>`
      ).join("");
      const meta = document.getElementById("meta");
      const parts = [];
      if (nav.brain_data_root) parts.push("数据目录: " + nav.brain_data_root);
      if (nav.brain_api) parts.push("API: " + nav.brain_api);
      meta.textContent = parts.join(" · ");
    }
    loadNav().catch(() => {
      document.getElementById("links").innerHTML =
        '<a class="card" href="/dashboard"><h2>记忆看板</h2><p>离线回退链接</p></a>' +
        '<a class="card" href="/lessons"><h2>教训库</h2><p>离线回退链接</p></a>' +
        '<a class="card" href="/mcp-lab"><h2>MCP 实验室</h2><p>离线回退链接</p></a>';
    });
  </script>
</body>
</html>
